services:
  - type: web
    name: n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: GENERIC_TIMEZONE
        value: America/Chicago
      # Set to <yourapp>.onrender.com after the first deploy
      - key: N8N_HOST
        sync: false
      # Set to https://<yourapp>.onrender.com/ after the first deploy
      - key: WEBHOOK_URL
        sync: false
      # Generated once by Render. Save a copy: losing it means re-entering every credential.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # External Postgres (Neon). Render's free Postgres expires.
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: true
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
